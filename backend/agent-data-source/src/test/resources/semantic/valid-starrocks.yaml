version: 1
datasets:
  - id: orders
    table: fact_orders
    name: 订单
    description: 已创建的业务订单
    synonyms: [交易, 销售订单]
    default-time-field: paid_at
    fields:
      - id: paid_amount
        column: paid_amount
        name: 实付金额
        role: measure
        data-type: decimal
        unit: CNY
        synonyms: [销售额, 成交额]
      - id: region
        column: region_code
        name: 地区
        role: dimension
      - id: paid_at
        column: paid_at
        name: 支付时间
        role: time
metrics:
  - id: paid_sales
    name: 销售额
    dataset: orders
    description: 已支付订单的实付金额合计
    aggregation: sum
    field: paid_amount
    filters: []
    unit: CNY
relationships: []
