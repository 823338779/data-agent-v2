data-agent:
  tool:
    # 联网 Tool 默认隐藏；只有读取 web-research Skill 后才在本次 execution 激活。
    maximum: [system_timezone, current_time, skill_read, web_search, web_fetch, memory, context_result_read]
    initial: [system_timezone, current_time, skill_read, memory, context_result_read]
    web-search:
      provider: tavily
      # 凭据仅从服务端环境变量注入，不进入 Tool 参数或日志。
      api-key: ${DATA_AGENT_TAVILY_API_KEY:}
      default-limit: ${DATA_AGENT_WEB_SEARCH_DEFAULT_LIMIT:5}
      default-depth: ${DATA_AGENT_WEB_SEARCH_DEFAULT_DEPTH:basic}
      connect-timeout: ${DATA_AGENT_WEB_SEARCH_CONNECT_TIMEOUT:5s}
      request-timeout: ${DATA_AGENT_WEB_SEARCH_REQUEST_TIMEOUT:20s}
      tool-timeout: ${DATA_AGENT_WEB_SEARCH_TOOL_TIMEOUT:25s}
      proxy: ${DATA_AGENT_WEB_SEARCH_PROXY:}
    web-fetch:
      connect-timeout: ${DATA_AGENT_WEB_FETCH_CONNECT_TIMEOUT:5s}
      request-timeout: ${DATA_AGENT_WEB_FETCH_REQUEST_TIMEOUT:20s}
      tool-timeout: ${DATA_AGENT_WEB_FETCH_TOOL_TIMEOUT:25s}
      max-redirects: ${DATA_AGENT_WEB_FETCH_MAX_REDIRECTS:3}
      max-response-bytes: ${DATA_AGENT_WEB_FETCH_MAX_RESPONSE_BYTES:1048576}
      default-max-characters: ${DATA_AGENT_WEB_FETCH_DEFAULT_MAX_CHARACTERS:12000}
      user-agent: ${DATA_AGENT_WEB_FETCH_USER_AGENT:Data-Agent-V2/0.1 web_fetch}
  context:
    # 会话上下文策略：raw 不压缩，lsm 使用 LSM 摘要树，hierarchical 使用滚动 Cold 摘要。
    # 当前默认启用 hierarchical；可通过 DATA_AGENT_CONTEXT_STRATEGY 在所有服务实例上统一覆盖。
    strategy: ${DATA_AGENT_CONTEXT_STRATEGY:hierarchical}
    model-input:
      # 非 Ollama provider 的预算必须不超过实际模型容量；建模与查询的工具历史也占用该预算。
      context-window-tokens: ${DATA_AGENT_CONTEXT_WINDOW_TOKENS:65536}
    # 以下参数仅在 strategy=lsm 时生效。
    compaction:
      fanout: ${DATA_AGENT_CONTEXT_COMPACTION_FANOUT:5}
      max-level: ${DATA_AGENT_CONTEXT_COMPACTION_MAX_LEVEL:4}
    # 旧 V2 参数仅保留兼容；V3 的 step-compaction 使用独立可用输入预算比例。
    hierarchical:
      trigger-ratio: ${DATA_AGENT_CONTEXT_HIERARCHICAL_TRIGGER_RATIO:0.75}
      target-ratio: ${DATA_AGENT_CONTEXT_HIERARCHICAL_TARGET_RATIO:0.70}
      step-compaction:
        trigger-ratio: ${DATA_AGENT_CONTEXT_HIERARCHICAL_STEP_TRIGGER_RATIO:0.70}
        target-ratio: ${DATA_AGENT_CONTEXT_HIERARCHICAL_STEP_TARGET_RATIO:0.55}
        retained-completed-groups: ${DATA_AGENT_CONTEXT_HIERARCHICAL_STEP_RETAINED_GROUPS:2}
        payload-max-bytes: ${DATA_AGENT_CONTEXT_HIERARCHICAL_STEP_PAYLOAD_MAX_BYTES:1048576}
        result-page-max-bytes: ${DATA_AGENT_CONTEXT_HIERARCHICAL_STEP_RESULT_PAGE_MAX_BYTES:4096}
  model:
    provider: ${DATA_AGENT_MODEL_PROVIDER:codex}
    codex:
      executable: ${DATA_AGENT_MODEL_CODEX_EXECUTABLE:codex}
      model: ${DATA_AGENT_MODEL_CODEX_MODEL:gpt-5.6-sol}
      effort: ${DATA_AGENT_MODEL_CODEX_EFFORT:medium}
      timeout: ${DATA_AGENT_MODEL_CODEX_TIMEOUT:5m}
      working-directory: ${DATA_AGENT_MODEL_CODEX_WORKING_DIRECTORY:}
  execution:
    deadline: ${DATA_AGENT_EXECUTION_DEADLINE:10m}
  react:
    limits:
      # dbt 建模与分析包含能力加载、文件分页和异步任务轮询；12 轮可能在生成卡片后阻断最终回答。
      # 仍保留模型次数、工具次数及 execution.deadline 三重上限。
      max-model-invocations: ${DATA_AGENT_REACT_MAX_MODEL_INVOCATIONS:32}
      max-tool-calls: ${DATA_AGENT_REACT_MAX_TOOL_CALLS:32}
  git:
    # 关闭时不装配 Git Tool、Skill、应用服务和工作目录；开启时 maximum 自动加入七个草稿工具。
    # initial 不允许包含 Git 工具，读取 git-repository-maintenance Skill 才激活。
    enabled: ${DATA_AGENT_GIT_ENABLED:false}
    remote-uri: ${DATA_AGENT_GIT_REMOTE_URI:}
    repository-id: ${DATA_AGENT_GIT_REPOSITORY_ID:metrics}
    workspace-root: ${DATA_AGENT_GIT_WORKSPACE_ROOT:./data/git}
    executable: ${DATA_AGENT_GIT_EXECUTABLE:git}
    author-name: ${DATA_AGENT_GIT_AUTHOR_NAME:Data Agent}
    author-email: ${DATA_AGENT_GIT_AUTHOR_EMAIL:data-agent@localhost}
    command-timeout: ${DATA_AGENT_GIT_COMMAND_TIMEOUT:30s}
    max-command-output-bytes: ${DATA_AGENT_GIT_MAX_COMMAND_OUTPUT_BYTES:4194304}
    max-file-bytes: ${DATA_AGENT_GIT_MAX_FILE_BYTES:524288}
    max-files-per-operation: ${DATA_AGENT_GIT_MAX_FILES_PER_OPERATION:20}
    max-candidate-files: ${DATA_AGENT_GIT_MAX_CANDIDATE_FILES:100}
    max-candidate-bytes: ${DATA_AGENT_GIT_MAX_CANDIDATE_BYTES:5242880}
    max-diff-bytes: ${DATA_AGENT_GIT_MAX_DIFF_BYTES:2097152}
  dbt:
    # 分析独立于 Git；两个开关同时开启才装配分支 SQL/YAML 维护及候选验证。
    enabled: ${DATA_AGENT_DBT_ENABLED:false}
    base-url: ${DATA_AGENT_DBT_BASE_URL:}
    project-id: ${DATA_AGENT_DBT_PROJECT_ID:}
    project-directory: ${DATA_AGENT_DBT_PROJECT_DIRECTORY:.}
    # 仅服务端发送给 dbt-service 的分支写入凭据，不进入模型上下文。
    branch-service-token: ${DATA_AGENT_DBT_BRANCH_SERVICE_TOKEN:}
    connect-timeout: ${DATA_AGENT_DBT_CONNECT_TIMEOUT:5s}
    request-timeout: ${DATA_AGENT_DBT_REQUEST_TIMEOUT:20s}
