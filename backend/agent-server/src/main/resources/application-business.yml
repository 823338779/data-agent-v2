data-agent:
  model:
    provider: ${DATA_AGENT_MODEL_PROVIDER:ollama}
    codex:
      executable: ${DATA_AGENT_MODEL_CODEX_EXECUTABLE:codex}
      model: ${DATA_AGENT_MODEL_CODEX_MODEL:}
      effort: ${DATA_AGENT_MODEL_CODEX_EFFORT:}
      timeout: ${DATA_AGENT_MODEL_CODEX_TIMEOUT:5m}
      working-directory: ${DATA_AGENT_MODEL_CODEX_WORKING_DIRECTORY:}
  runtime:
    max-concurrent-executions-per-instance: ${DATA_AGENT_MAX_CONCURRENT_EXECUTIONS_PER_INSTANCE:256}
    queue-scan-interval: ${DATA_AGENT_QUEUE_SCAN_INTERVAL:1s}
    control-poll-interval: ${DATA_AGENT_CONTROL_POLL_INTERVAL:1s}
    session-event-reconcile-interval: ${DATA_AGENT_SESSION_EVENT_RECONCILE_INTERVAL:1s}
    activity-reconcile-interval: ${DATA_AGENT_ACTIVITY_RECONCILE_INTERVAL:2s}
    execution-budget: ${DATA_AGENT_EXECUTION_BUDGET:10m}
    lease-duration: ${DATA_AGENT_EXECUTION_LEASE_DURATION:60s}
    heartbeat-interval: ${DATA_AGENT_EXECUTION_HEARTBEAT_INTERVAL:15s}
    scheduling-enabled: ${DATA_AGENT_RUNTIME_SCHEDULING_ENABLED:true}
  auth:
    session:
      secure-cookie: ${DATA_AGENT_SESSION_SECURE_COOKIE:false}
      lifetime: ${DATA_AGENT_SESSION_LIFETIME:PT8H}
    bootstrap:
      enabled: ${DATA_AGENT_BOOTSTRAP_ENABLED:true}
      password: ${DATA_AGENT_BOOTSTRAP_PASSWORD:admin}
