data-agent:
  tool:
    # 联网 Tool 默认隐藏；只有读取 web-research Skill 后才在本次 execution 激活。
    maximum: [system_timezone, current_time, skill_read, web_search, web_fetch]
    initial: [system_timezone, current_time, skill_read]
    web-search:
      provider: tavily
      # 凭据仅从服务端环境变量注入，不进入 Tool 参数或日志。
      api-key: ${DATA_AGENT_TAVILY_API_KEY:}
      default-limit: ${DATA_AGENT_WEB_SEARCH_DEFAULT_LIMIT:5}
      default-depth: ${DATA_AGENT_WEB_SEARCH_DEFAULT_DEPTH:basic}
      connect-timeout: ${DATA_AGENT_WEB_SEARCH_CONNECT_TIMEOUT:5s}
      request-timeout: ${DATA_AGENT_WEB_SEARCH_REQUEST_TIMEOUT:20s}
      tool-timeout: ${DATA_AGENT_WEB_SEARCH_TOOL_TIMEOUT:25s}
      proxy: ${DATA_AGENT_WEB_SEARCH_PROXY:}
    web-fetch:
      connect-timeout: ${DATA_AGENT_WEB_FETCH_CONNECT_TIMEOUT:5s}
      request-timeout: ${DATA_AGENT_WEB_FETCH_REQUEST_TIMEOUT:20s}
      tool-timeout: ${DATA_AGENT_WEB_FETCH_TOOL_TIMEOUT:25s}
      max-redirects: ${DATA_AGENT_WEB_FETCH_MAX_REDIRECTS:3}
      max-response-bytes: ${DATA_AGENT_WEB_FETCH_MAX_RESPONSE_BYTES:1048576}
      default-max-characters: ${DATA_AGENT_WEB_FETCH_DEFAULT_MAX_CHARACTERS:12000}
      user-agent: ${DATA_AGENT_WEB_FETCH_USER_AGENT:Data-Agent-V2/0.1 web_fetch}
  context:
    # 会话上下文策略：raw 不压缩，lsm 使用 LSM 摘要树，hierarchical 使用滚动 Cold 摘要。
    # 当前默认启用 hierarchical；可通过 DATA_AGENT_CONTEXT_STRATEGY 在所有服务实例上统一覆盖。
    strategy: ${DATA_AGENT_CONTEXT_STRATEGY:hierarchical}
    # 以下参数仅在 strategy=lsm 时生效。
    compaction:
      fanout: ${DATA_AGENT_CONTEXT_COMPACTION_FANOUT:5}
      max-level: ${DATA_AGENT_CONTEXT_COMPACTION_MAX_LEVEL:4}
    # 以下参数仅在 strategy=hierarchical 时生效：超过 75% 触发压缩，目标压缩至 70%。
    hierarchical:
      trigger-ratio: ${DATA_AGENT_CONTEXT_HIERARCHICAL_TRIGGER_RATIO:0.75}
      target-ratio: ${DATA_AGENT_CONTEXT_HIERARCHICAL_TARGET_RATIO:0.70}
      # 算法固定原样保护按 user 消息划分的最后 10 个轮次。
  model:
    provider: ${DATA_AGENT_MODEL_PROVIDER:codex}
    codex:
      executable: ${DATA_AGENT_MODEL_CODEX_EXECUTABLE:codex}
      model: ${DATA_AGENT_MODEL_CODEX_MODEL:gpt-5.6-sol}
      effort: ${DATA_AGENT_MODEL_CODEX_EFFORT:medium}
      timeout: ${DATA_AGENT_MODEL_CODEX_TIMEOUT:5m}
      working-directory: ${DATA_AGENT_MODEL_CODEX_WORKING_DIRECTORY:}
  execution:
    deadline: ${DATA_AGENT_EXECUTION_DEADLINE:10m}
  workflow:
    # 未配置真实 StarRocks 与语义目录前保持关闭；启用后连接或语义不一致会在启动期失败。
    enabled: ${DATA_AGENT_WORKFLOW_ENABLED:false}
    max-query-tasks: ${DATA_AGENT_WORKFLOW_MAX_QUERY_TASKS:5}
    max-query-plan-attempts: ${DATA_AGENT_WORKFLOW_MAX_PLAN_ATTEMPTS:3}
    max-sql-attempts-per-task: ${DATA_AGENT_WORKFLOW_MAX_SQL_ATTEMPTS:3}
    max-transient-query-retries: ${DATA_AGENT_WORKFLOW_MAX_TRANSIENT_RETRIES:1}
    max-generated-sql-bytes: ${DATA_AGENT_WORKFLOW_MAX_SQL_BYTES:64KB}
    max-semantic-resources: ${DATA_AGENT_WORKFLOW_MAX_SEMANTIC_RESOURCES:30}
    max-analysis-input-bytes: ${DATA_AGENT_WORKFLOW_MAX_ANALYSIS_BYTES:512KB}
    hard-timeout: ${DATA_AGENT_WORKFLOW_TIMEOUT:120s}
  datasource:
    jdbc-url: ${DATA_AGENT_STARROCKS_JDBC_URL:}
    username: ${DATA_AGENT_STARROCKS_USERNAME:}
    password: ${DATA_AGENT_STARROCKS_PASSWORD:}
    default-catalog: ${DATA_AGENT_STARROCKS_CATALOG:default_catalog}
    default-database: ${DATA_AGENT_STARROCKS_DATABASE:analytics}
    connect-timeout: ${DATA_AGENT_STARROCKS_CONNECT_TIMEOUT:5s}
    query-timeout: ${DATA_AGENT_STARROCKS_QUERY_TIMEOUT:30s}
    max-rows: ${DATA_AGENT_STARROCKS_MAX_ROWS:1000}
    max-result-bytes: ${DATA_AGENT_STARROCKS_MAX_RESULT_BYTES:4MB}
    semantic-config: classpath:semantic/starrocks.yaml
