spring:
  application:
    name: data-agent-v2
  datasource:
    url: ${DATA_AGENT_DB_URL:jdbc:postgresql://localhost:5432/data_agent_v2}
    username: ${DATA_AGENT_DB_USERNAME:data_agent}
    password: ${DATA_AGENT_DB_PASSWORD:data_agent_local_dev}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      username: ${SPRING_DATA_REDIS_USERNAME:default}
      password: ${SPRING_DATA_REDIS_PASSWORD:redis_local_dev}
  flyway:
    enabled: true

data-agent:
  auth:
    session:
      secure-cookie: ${DATA_AGENT_SESSION_SECURE_COOKIE:false}
      lifetime: ${DATA_AGENT_SESSION_LIFETIME:PT8H}
    bootstrap:
      enabled: ${DATA_AGENT_BOOTSTRAP_ENABLED:true}
      password: ${DATA_AGENT_BOOTSTRAP_PASSWORD:admin}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
