version: 2

# 使用 dbt 1.12 的语义定义：实体和维度写在列上，基础指标写在模型内。
models:
  - name: fct_orders
    description: 模拟订单事实表，一行一笔订单；金额和成本单位均为人民币元。
    semantic_model:
      enabled: true
    agg_time_dimension: ordered_at
    columns:
      - name: order_id
        description: 唯一订单标识，也是订单维度的命名空间。
        entity: {name: order, type: primary}
        data_tests: [unique, not_null]
      - name: customer_id
        description: 关联客户维度的外键；与 dim_customers 中的 customer 实体对应。
        entity: {name: customer, type: foreign}
        data_tests:
          - not_null
          - relationships:
              arguments: {to: "ref('dim_customers')", field: customer_id}
      - name: ordered_at
        description: 订单日期，所有演示指标按该日期归属，不代表支付到账日期。
        granularity: day
        dimension: {type: time}
        data_tests: [not_null]
      - name: status
        description: paid 已支付、pending 待支付、cancelled 已取消；只有 paid 计入收入。
        dimension: {type: categorical}
        data_tests:
          - accepted_values:
              arguments: {values: [paid, pending, cancelled]}
      - name: amount
        description: 订单金额，人民币元；未支付和取消订单仍保留其原始金额。
      - name: cost
        description: 订单对应成本，人民币元；示例统一设为订单金额的百分之六十。
    metrics:
      - name: revenue
        label: 已支付收入
        description: 仅累计 paid 订单金额，人民币元；排除待支付和取消订单。
        type: simple
        agg: sum
        expr: amount
        filter: "{{ Dimension('order__status') }} = 'paid'"
      - name: paid_orders
        label: 已支付订单数
        description: paid 状态的订单去重数。
        type: simple
        agg: count_distinct
        expr: order_id
        filter: "{{ Dimension('order__status') }} = 'paid'"
      - name: total_cost
        label: 已支付订单成本
        description: 与收入使用相同订单集合的成本合计，人民币元。
        type: simple
        agg: sum
        expr: cost
        filter: "{{ Dimension('order__status') }} = 'paid'"

  - name: dim_customers
    description: 四名虚构客户；地区和客群通过客户实体提供给订单指标查询。
    semantic_model:
      enabled: true
    columns:
      - name: customer_id
        description: 客户唯一标识，必须唯一以避免关联后重复计算订单金额。
        entity: {name: customer, type: primary}
        data_tests: [unique, not_null]
      - name: customer_name
        description: 虚构客户英文姓名。
      - name: region
        description: east 华东、south 华南、north 华北。
        dimension: {type: categorical}
      - name: segment
        description: enterprise 企业客户、individual 个人客户。
        dimension: {type: categorical}

  - name: time_spine
    description: 2025年12月1日至2026年2月28日的连续日历，用于累计和环比。
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        description: 唯一自然日，时间骨架的最小粒度为一天。
        granularity: day
        data_tests: [unique, not_null]

metrics:
  - name: average_order_value
    label: 客单价
    description: 已支付收入除以已支付订单数，人民币元每单；按当前分组重新计算。
    type: ratio
    numerator: revenue
    denominator: paid_orders
  - name: gross_profit
    label: 毛利润
    description: 已支付收入减去对应成本，人民币元。
    type: derived
    expr: revenue - total_cost
    input_metrics:
      - name: revenue
      - name: total_cost
  - name: gross_margin
    label: 毛利率
    description: 毛利润除以收入；返回小数，0.4 表示百分之四十。
    type: ratio
    numerator: gross_profit
    denominator: revenue
  - name: cumulative_revenue
    label: 累计收入
    description: 从样例数据起点累计至当前时间粒度期末的已支付收入，人民币元。
    type: cumulative
    input_metric: revenue
    period_agg: last
  - name: revenue_growth_mom
    label: 收入月环比
    description: 当前月收入相对上月的增长比例；没有上月收入时为空，0.27 表示增长百分之二十七。
    type: derived
    expr: (revenue - previous_revenue) / nullif(previous_revenue, 0)
    input_metrics:
      - name: revenue
      - name: revenue
        alias: previous_revenue
        offset_window: 1 month
