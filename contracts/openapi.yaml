openapi: 3.1.0
info:
  title: Data Agent V2 API
  version: 0.2.0
  description: 单实例本地执行模式下的会话 REST 与 SSE 契约。

paths:
  /api/v1/agent-sidebar:
    get:
      operationId: getConversationSidebar
      responses:
        '200':
          description: 同一数据库快照中的活动项目和全部会话摘要
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationSidebar' }
  /api/v1/agent-projects:
    post:
      operationId: createConversationProject
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateConversationProjectRequest' }
      responses:
        '201':
          description: 已创建项目
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationProject' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
  /api/v1/agent-projects/{projectId}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
    patch:
      operationId: renameConversationProject
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RenameConversationProjectRequest' }
      responses:
        '200':
          description: 已重命名项目
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationProject' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: deleteConversationProject
      parameters:
        - name: expectedVersion
          in: query
          required: true
          schema: { type: integer, format: int64, minimum: 0 }
      responses:
        '204': { description: 项目已逻辑删除，会话移至未分组并保留置顶 }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/agent-sessions/{conversationSessionId}/organization:
    put:
      operationId: setConversationOrganization
      parameters:
        - { $ref: '#/components/parameters/ConversationSessionId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetConversationOrganizationRequest' }
      responses:
        '200':
          description: 已设置归属和置顶，不读取会话正文
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationSessionSummary' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/agent-sessions:
    get:
      operationId: listConversationSessions
      responses:
        '200':
          description: 按更新时间倒序排列的会话摘要
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ConversationSessionSummary' }
    post:
      operationId: createConversationSession
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateConversationSessionRequest' }
      responses:
        '201':
          description: 已创建会话
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationSession' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/agent-sessions/summary-events:
    get:
      operationId: streamConversationSummaries
      responses:
        '200':
          description: 当前会话摘要快照及本机后续更新
          content:
            text/event-stream:
              schema: { $ref: '#/components/schemas/ConversationSummarySnapshot' }
  /api/v1/agent-sessions/{conversationSessionId}:
    get:
      operationId: getConversationSession
      parameters:
        - { $ref: '#/components/parameters/ConversationSessionId' }
      responses:
        '200':
          description: 会话详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationSession' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: renameConversationSession
      parameters:
        - { $ref: '#/components/parameters/ConversationSessionId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RenameConversationSessionRequest' }
      responses:
        '200':
          description: 已更新标题的会话
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationSession' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/agent-sessions/{conversationSessionId}/messages:
    post:
      operationId: submitConversationMessage
      parameters:
        - { $ref: '#/components/parameters/ConversationSessionId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitConversationMessageRequest' }
      responses:
        '202':
          description: 消息已持久化，并已启动本机执行
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationSession' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/agent-sessions/{conversationSessionId}/artifacts/{artifactId}/content:
    get:
      operationId: downloadConversationArtifact
      parameters:
        - { $ref: '#/components/parameters/ConversationSessionId' }
        - { $ref: '#/components/parameters/ArtifactId' }
      responses:
        '200':
          description: 已通过会话归属与完整性校验的 Office 文件流
          headers:
            Content-Disposition: { schema: { type: string } }
            ETag: { schema: { type: string } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/agent-sessions/{conversationSessionId}/executions/{executionId}:cancel:
    post:
      operationId: cancelAgentExecution
      parameters:
        - { $ref: '#/components/parameters/ConversationSessionId' }
        - { $ref: '#/components/parameters/ExecutionId' }
      responses:
        '202':
          description: 已请求取消本机执行
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentExecution' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/agent-sessions/{conversationSessionId}/events:
    get:
      operationId: streamConversationSessionEvents
      parameters:
        - { $ref: '#/components/parameters/ConversationSessionId' }
      responses:
        '200':
          description: 权威会话快照及本机实时增量
          content:
            text/event-stream:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/ConversationSessionSnapshotEvent' }
                  - { $ref: '#/components/schemas/ConversationExecutionUpdateEvent' }
                  - { $ref: '#/components/schemas/ConversationMessageUpdateEvent' }
                  - { $ref: '#/components/schemas/AgentExecutionStreamSnapshotEvent' }
                  - { $ref: '#/components/schemas/AssistantDeltaEvent' }
                  - { $ref: '#/components/schemas/WorkflowSnapshotEvent' }
                  - { $ref: '#/components/schemas/WorkflowUpdateEvent' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
    ConversationSessionId:
      name: conversationSessionId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    ExecutionId:
      name: executionId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    ArtifactId:
      name: artifactId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 80 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
  responses:
    ValidationFailed:
      description: 请求校验失败
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    NotFound:
      description: 资源不存在
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Conflict:
      description: 当前状态不允许该操作
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    IdempotencyKeyReused:
      description: 幂等键已用于其他请求
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
          example:
            code: IDEMPOTENCY_KEY_REUSED
  schemas:
    ConversationProject:
      type: object
      required: [projectId, name, version, createdAt, updatedAt]
      properties:
        projectId: { type: string }
        name: { type: string }
        version: { type: integer, format: int64, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ConversationSidebar:
      type: object
      required: [projects, sessions]
      properties:
        projects:
          type: array
          items: { $ref: '#/components/schemas/ConversationProject' }
        sessions:
          type: array
          items: { $ref: '#/components/schemas/ConversationSessionSummary' }
    CreateConversationProjectRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, description: 去除首尾空白后为1至60个UTF-16代码单元 }
    RenameConversationProjectRequest:
      type: object
      additionalProperties: false
      required: [name, expectedVersion]
      properties:
        name: { type: string, description: 去除首尾空白后为1至60个UTF-16代码单元 }
        expectedVersion: { type: integer, format: int64, minimum: 0 }
    SetConversationOrganizationRequest:
      type: object
      additionalProperties: false
      required: [projectId, pinned, expectedVersion]
      properties:
        projectId: { type: [string, 'null'], minLength: 1, maxLength: 64 }
        pinned: { type: boolean }
        expectedVersion: { type: integer, format: int64, minimum: 0 }
    CreateConversationSessionRequest:
      type: object
      additionalProperties: false
      properties:
        title: { type: [string, 'null'], maxLength: 120 }
        tag: { type: [string, 'null'], maxLength: 120 }
        projectId: { type: [string, 'null'], minLength: 1, maxLength: 64 }
    RenameConversationSessionRequest:
      type: object
      additionalProperties: false
      required: [title, expectedVersion]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        expectedVersion: { type: integer, format: int64, minimum: 0 }
    SubmitConversationMessageRequest:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content: { type: string, minLength: 1, maxLength: 8000 }
    ConversationSession:
      type: object
      required: [conversationSessionId, title, tag, projectId, pinnedAt, createdAt, updatedAt, version, messages]
      properties:
        conversationSessionId: { type: string }
        title: { type: string }
        tag: { type: string }
        projectId: { type: [string, 'null'] }
        pinnedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, format: int64 }
        messages:
          type: array
          items: { $ref: '#/components/schemas/ConversationMessage' }
        execution:
          oneOf:
            - { $ref: '#/components/schemas/AgentExecution' }
            - { type: 'null' }
    ConversationSessionSummary:
      type: object
      required: [conversationSessionId, title, tag, projectId, pinnedAt, createdAt, updatedAt, version, status]
      properties:
        conversationSessionId: { type: string }
        title: { type: string }
        tag: { type: string }
        projectId: { type: [string, 'null'] }
        pinnedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, format: int64 }
        status: { type: string, enum: [idle, running, done, cancelled, failed] }
    ConversationSummaryStreamItem:
      type: object
      required: [conversationSessionId, status, updatedAt]
      properties:
        conversationSessionId: { type: string }
        status: { type: string, enum: [idle, running, done, cancelled, failed] }
        updatedAt: { type: string, format: date-time }
    ConversationSummarySnapshot:
      type: object
      required: [type, sessions, snapshotAt]
      properties:
        type: { type: string, const: conversation_summary_snapshot }
        sessions:
          type: array
          items: { $ref: '#/components/schemas/ConversationSummaryStreamItem' }
        snapshotAt: { type: string, format: date-time }
    ConversationMessage:
      type: object
      required: [conversationMessageId, executionId, role, author, content, version, thinkingProcess, artifacts, uiBlocks, createdAt]
      properties:
        conversationMessageId: { type: string }
        executionId: { type: [string, 'null'] }
        role: { type: string, enum: [user, assistant] }
        author: { type: string }
        content: { type: string }
        version: { type: integer, format: int64, minimum: 0 }
        thinkingProcess:
          type: array
          items: { type: object, additionalProperties: true }
        artifacts:
          type: array
          items: { $ref: '#/components/schemas/ArtifactView' }
        uiBlocks:
          type: array
          items: { $ref: '#/components/schemas/MessageUiBlockView' }
        createdAt: { type: string, format: date-time }
        execution:
          oneOf:
            - { $ref: '#/components/schemas/AgentExecution' }
            - { type: 'null' }
    ArtifactView:
      type: object
      additionalProperties: false
      required: [artifactId, artifactType, displayName, mediaType, sizeBytes, sha256, pageOrSheetCount, downloadUrl]
      properties:
        artifactId: { type: string }
        artifactType: { type: string, enum: [DOCX, PPTX, XLSX] }
        displayName: { type: string }
        mediaType: { type: string }
        sizeBytes: { type: integer, format: int64, minimum: 1 }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        pageOrSheetCount: { type: [integer, 'null'], minimum: 1 }
        downloadUrl:
          type: string
          pattern: '^/api/v1/agent-sessions/[^/]+/artifacts/[^/]+/content$'
    MessageUiBlockView:
      type: object
      additionalProperties: false
      required: [blockId, type, schemaVersion, variant, payload, displayOrder]
      properties:
        blockId: { type: string }
        type: { type: string, const: artifact-card }
        schemaVersion: { type: integer, const: 1 }
        variant: { type: string }
        payload:
          type: object
          additionalProperties: false
          required: [artifactId]
          properties:
            artifactId: { type: string }
        displayOrder: { type: integer, minimum: 0 }
    AgentExecution:
      type: object
      required: [executionId, status, progress, objective, events]
      properties:
        executionId: { type: string }
        status: { type: string, enum: [running, done, cancelled, failed] }
        progress: { type: integer, minimum: 0, maximum: 100 }
        objective: { type: string }
        events:
          type: array
          items: { $ref: '#/components/schemas/AgentExecutionEvent' }
        streamCheckpoint:
          oneOf:
            - { $ref: '#/components/schemas/AgentExecutionStreamCheckpoint' }
            - { type: 'null' }
    AgentExecutionState:
      type: object
      required: [executionId, status, progress, objective]
      properties:
        executionId: { type: string }
        status: { type: string, enum: [running, done, cancelled, failed] }
        progress: { type: integer, minimum: 0, maximum: 100 }
        objective: { type: string }
        streamCheckpoint:
          oneOf:
            - { $ref: '#/components/schemas/AgentExecutionStreamCheckpoint' }
            - { type: 'null' }
    AgentExecutionEvent:
      type: object
      required: [executionEventId, executionEventSequence, type, occurredAt, executionId, status]
      properties:
        executionEventId: { type: string }
        executionEventSequence: { type: integer, format: int64 }
        type: { type: string }
        occurredAt: { type: string, format: date-time }
        executionId: { type: string }
        status: { type: string, enum: [running, done, cancelled, failed] }
    AgentExecutionStreamCheckpoint:
      type: object
      required: [modelInvocationSequence, phase, outputDeltaSequence, answer]
      properties:
        modelInvocationSequence: { type: integer, format: int64, minimum: 0 }
        phase:
          type: string
          enum: [RECEIVED, PREPARING_CONTEXT, CONNECTING_MODEL, ANSWERING, PERSISTING, COMPLETED]
        outputDeltaSequence: { type: integer, format: int64, minimum: 0 }
        answer: { type: string }
    ConversationSessionSnapshotEvent:
      type: object
      required: [type, conversationSessionId, session, occurredAt]
      properties:
        type: { type: string, const: session_snapshot }
        conversationSessionId: { type: string }
        session: { $ref: '#/components/schemas/ConversationSession' }
        occurredAt: { type: string, format: date-time }
    ConversationExecutionUpdateEvent:
      type: object
      required: [type, conversationSessionId, execution, event, messages]
      properties:
        type: { type: string, const: execution_update }
        conversationSessionId: { type: string }
        execution: { $ref: '#/components/schemas/AgentExecutionState' }
        event: { $ref: '#/components/schemas/AgentExecutionEvent' }
        messages:
          type: array
          items: { $ref: '#/components/schemas/ConversationMessage' }
    ConversationMessageUpdateEvent:
      type: object
      required: [type, conversationSessionId, message, occurredAt]
      properties:
        type: { type: string, const: message_update }
        conversationSessionId: { type: string }
        message: { $ref: '#/components/schemas/ConversationMessage' }
        occurredAt: { type: string, format: date-time }
    AgentExecutionStreamSnapshotEvent:
      type: object
      required: [type, conversationSessionId, executionId, modelInvocationSequence, outputDeltaSequence, phase, answer, occurredAt]
      properties:
        type: { type: string, const: stream_snapshot }
        conversationSessionId: { type: string }
        executionId: { type: string }
        modelInvocationSequence: { type: integer, minimum: 0 }
        outputDeltaSequence: { type: integer, format: int64, minimum: 0 }
        phase: { type: string }
        answer: { type: string }
        occurredAt: { type: string, format: date-time }
    AssistantDeltaEvent:
      type: object
      required: [type, conversationSessionId, executionId, modelInvocationSequence, outputDeltaSequence, delta, occurredAt]
      properties:
        type: { type: string, const: assistant_delta }
        conversationSessionId: { type: string }
        executionId: { type: string }
        modelInvocationSequence: { type: integer, minimum: 0 }
        outputDeltaSequence: { type: integer, format: int64, minimum: 0 }
        delta: { type: string }
        occurredAt: { type: string, format: date-time }
    WorkflowSnapshotEvent:
      type: object
      required: [type, conversationSessionId, executionId, workflow, occurredAt]
      properties:
        type: { type: string, const: workflow_snapshot }
        conversationSessionId: { type: string }
        executionId: { type: string }
        workflow: { $ref: '#/components/schemas/WorkflowSnapshot' }
        occurredAt: { type: string, format: date-time }
    WorkflowUpdateEvent:
      type: object
      required: [type, conversationSessionId, executionId, workflowId, sequence, eventType, step, status, task, detail, occurredAt]
      properties:
        type: { type: string, const: workflow_update }
        conversationSessionId: { type: string }
        executionId: { type: string }
        workflowId: { type: string }
        sequence: { type: integer, format: int64, minimum: 1 }
        eventType:
          type: string
          enum: [workflow_started, step_started, step_progress, step_succeeded, step_failed, step_retrying, workflow_succeeded, workflow_failed]
        step: { $ref: '#/components/schemas/WorkflowStep' }
        status: { $ref: '#/components/schemas/WorkflowStatus' }
        task:
          oneOf:
            - { $ref: '#/components/schemas/WorkflowTaskRef' }
            - { type: 'null' }
        detail: { $ref: '#/components/schemas/WorkflowEventDetail' }
        occurredAt: { type: string, format: date-time }
    WorkflowSnapshot:
      type: object
      required: [workflowId, executionId, latestSequence, status, currentStep, tasks, startedAt, updatedAt]
      properties:
        workflowId: { type: string }
        executionId: { type: string }
        latestSequence: { type: integer, format: int64, minimum: 0 }
        status: { $ref: '#/components/schemas/WorkflowStatus' }
        currentStep: { $ref: '#/components/schemas/WorkflowStep' }
        tasks:
          type: array
          items: { $ref: '#/components/schemas/WorkflowTaskSnapshot' }
        startedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    WorkflowTaskSnapshot:
      type: object
      required: [task, currentStep, sql, returnedRows, truncated, attempt, message]
      properties:
        task: { $ref: '#/components/schemas/WorkflowTaskRef' }
        currentStep: { $ref: '#/components/schemas/WorkflowStep' }
        sql: { type: [string, 'null'] }
        returnedRows: { type: [integer, 'null'], format: int64, minimum: 0 }
        truncated: { type: [boolean, 'null'] }
        attempt: { type: [integer, 'null'], minimum: 1 }
        message: { type: [string, 'null'] }
    WorkflowTaskRef:
      type: object
      required: [taskId, purpose, index, total]
      properties:
        taskId: { type: string }
        purpose: { type: string }
        index: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 1 }
    WorkflowEventDetail:
      type: object
      additionalProperties: false
      required: [semanticResourceNames, sql, returnedRows, truncated, attempt, maxAttempts, elapsedMillis, message, failureCode]
      properties:
        semanticResourceNames: { type: array, items: { type: string } }
        sql: { type: [string, 'null'] }
        returnedRows: { type: [integer, 'null'], format: int64, minimum: 0 }
        truncated: { type: [boolean, 'null'] }
        attempt: { type: [integer, 'null'], minimum: 1 }
        maxAttempts: { type: [integer, 'null'], minimum: 1 }
        elapsedMillis: { type: [integer, 'null'], format: int64, minimum: 0 }
        message: { type: [string, 'null'] }
        failureCode: { type: [string, 'null'] }
    WorkflowStatus:
      type: string
      enum: [running, succeeded, failed, cancelled, timed_out]
    WorkflowStep:
      type: string
      enum: [discover_semantic_resources, build_query_plan, validate_query_plan, generate_sql, validate_sql, explain_sql, execute_query, verify_results, analyze_results, finalize_response]
    ProblemDetail:
      type: object
      required: [title, status, detail, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
        requestId: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
