openapi: 3.1.0
info:
  title: Data Agent V2 API
  version: 0.2.0
  description: 单实例本地执行模式下的会话 REST 与 SSE 契约。

paths:
  /api/v1/agent-sidebar:
    get:
      operationId: getConversationSidebar
      responses:
        '200':
          description: 同一数据库快照中的活动项目和全部会话摘要
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationSidebar' }
  /api/v1/agent-projects:
    get:
      operationId: listDevelopmentProjects
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevelopmentProjectPage'
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
    post:
      operationId: createConversationProject
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateConversationProjectRequest' }
      responses:
        '201':
          description: 已创建项目
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationProject' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
  /api/v1/agent-projects/{projectId}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
    patch:
      operationId: renameConversationProject
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RenameConversationProjectRequest' }
      responses:
        '200':
          description: 已重命名项目
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationProject' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: deleteConversationProject
      parameters:
        - name: expectedVersion
          in: query
          required: true
          schema: { type: integer, format: int64, minimum: 0 }
      responses:
        '204': { description: 项目已逻辑删除，会话移至未分组并保留置顶 }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/agent-sessions/{conversationSessionId}/organization:
    put:
      operationId: setConversationOrganization
      parameters:
        - { $ref: '#/components/parameters/ConversationSessionId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetConversationOrganizationRequest' }
      responses:
        '200':
          description: 已设置归属和置顶，不读取会话正文
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationSessionSummary' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/agent-sessions:
    get:
      operationId: listConversationSessions
      responses:
        '200':
          description: 按更新时间倒序排列的会话摘要
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ConversationSessionSummary' }
    post:
      operationId: createConversationSession
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateConversationSessionRequest' }
      responses:
        '201':
          description: 已创建会话
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationSession' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/agent-sessions/summary-events:
    get:
      operationId: streamConversationSummaries
      responses:
        '200':
          description: 当前会话摘要快照及本机后续更新
          content:
            text/event-stream:
              schema: { $ref: '#/components/schemas/ConversationSummarySnapshot' }
  /api/v1/agent-sessions/{conversationSessionId}:
    get:
      operationId: getConversationSession
      parameters:
        - { $ref: '#/components/parameters/ConversationSessionId' }
      responses:
        '200':
          description: 会话详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationSession' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: renameConversationSession
      parameters:
        - { $ref: '#/components/parameters/ConversationSessionId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RenameConversationSessionRequest' }
      responses:
        '200':
          description: 已更新标题的会话
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationSession' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/agent-sessions/{conversationSessionId}/messages:
    post:
      operationId: submitConversationMessage
      parameters:
        - { $ref: '#/components/parameters/ConversationSessionId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitConversationMessageRequest' }
      responses:
        '202':
          description: 消息已持久化，并已启动本机执行
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationSession' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/agent-sessions/{conversationSessionId}/executions/{executionId}:cancel:
    post:
      operationId: cancelAgentExecution
      parameters:
        - { $ref: '#/components/parameters/ConversationSessionId' }
        - { $ref: '#/components/parameters/ExecutionId' }
      responses:
        '202':
          description: 已请求取消本机执行
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentExecution' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/agent-sessions/{conversationSessionId}/events:
    get:
      operationId: streamConversationSessionEvents
      parameters:
        - { $ref: '#/components/parameters/ConversationSessionId' }
      responses:
        '200':
          description: 权威会话快照及本机实时增量
          content:
            text/event-stream:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/ConversationSessionSnapshotEvent' }
                  - { $ref: '#/components/schemas/ConversationExecutionUpdateEvent' }
                  - { $ref: '#/components/schemas/ConversationMessageUpdateEvent' }
                  - { $ref: '#/components/schemas/AgentExecutionStreamSnapshotEvent' }
                  - { $ref: '#/components/schemas/AssistantDeltaEvent' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/agent-sessions/{sessionId}/git-changes/{changeId}:
    get:
      operationId: getGitChange
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string, minLength: 1 } }
        - { name: changeId, in: path, required: true, schema: { type: string, minLength: 1 } }
      responses:
        '200':
          description: 查询当前会话候选详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GitChange' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413':
          description: GIT_LIMIT_EXCEEDED 等资源上限错误
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '503':
          description: Git 未配置、远端暂不可达或执行不可用
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '504':
          description: Git 子进程超时
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
  /api/v1/agent-sessions/{sessionId}/git-changes/{changeId}/files:
    get:
      operationId: listGitChangeFiles
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string, minLength: 1 } }
        - { name: changeId, in: path, required: true, schema: { type: string, minLength: 1 } }
      responses:
        '200':
          description: 仅返回登记文件摘要，不含 diff 正文
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/GitChangeFile' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413':
          description: GIT_LIMIT_EXCEEDED 等资源上限错误
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '503':
          description: Git 未配置、远端暂不可达或执行不可用
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '504':
          description: Git 子进程超时
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
  /api/v1/agent-sessions/{sessionId}/git-changes/{changeId}/diff:
    get:
      operationId: getGitChangeDiff
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string, minLength: 1 } }
        - { name: changeId, in: path, required: true, schema: { type: string, minLength: 1 } }
        - { name: fileId, in: query, required: true, schema: { type: string, minLength: 1 } }
      responses:
        '200':
          description: 读取已登记文件的完整冻结 diff
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GitChangeDiff' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413':
          description: GIT_LIMIT_EXCEEDED 等资源上限错误
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '503':
          description: Git 未配置、远端暂不可达或执行不可用
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '504':
          description: Git 子进程超时
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
  /api/v1/agent-projects/{projectId}/development-config:
    get:
      operationId: getDevelopmentConfig
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevelopmentConfig'
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: configureDevelopment
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevelopmentConfig'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevelopmentConfigRequest'
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
  /api/v1/agent-projects/{projectId}/branches:
    get:
      operationId: listDevelopmentBranches
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevelopmentBranchPage'
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: createDevelopmentBranch
      responses:
        '202':
          description: 请求已受理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevelopmentOperation'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevelopmentBranchRequest'
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
  /api/v1/agent-sessions/{sessionId}/development:
    get:
      operationId: getDevelopmentOverview
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevelopmentOverview'
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
  /api/v1/agent-sessions/{sessionId}/development/save:
    post:
      operationId: saveDevelopment
      responses:
        '202':
          description: 请求已受理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevelopmentOperation'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevelopmentSaveRequest'
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
  /api/v1/agent-sessions/{sessionId}/development/preview:
    post:
      operationId: previewDevelopment
      responses:
        '202':
          description: 请求已受理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevelopmentOperation'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevelopmentPreviewRequest'
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
  /api/v1/agent-sessions/{sessionId}/development/deliver:
    post:
      operationId: deliverDevelopment
      responses:
        '202':
          description: 请求已受理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevelopmentOperation'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevelopmentDeliverRequest'
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
  /api/v1/agent-sessions/{sessionId}/development/operations/{operationId}:
    get:
      operationId: getDevelopmentOperation
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevelopmentOperation'
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
      - name: operationId
        in: path
        required: true
        schema:
          type: string
  /api/v1/agent-sessions/{sessionId}/development/operations/{operationId}/recover:
    post:
      operationId: recoverDevelopmentOperation
      responses:
        '202':
          description: 请求已受理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevelopmentOperation'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevelopmentRecoverRequest'
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
      - name: operationId
        in: path
        required: true
        schema:
          type: string
  /api/v1/agent-sessions/{sessionId}/development/files:
    get:
      operationId: listDevelopmentFiles
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevelopmentFiles'
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
      - name: directory
        in: query
        required: false
        schema:
          type: string
    post:
      operationId: writeDevelopmentFiles
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevelopmentRevision'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevelopmentFileRequest'
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
  /api/v1/agent-sessions/{sessionId}/development/file:
    get:
      operationId: readDevelopmentFile
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevelopmentFile'
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
      - name: path
        in: query
        required: true
        schema:
          type: string
  /api/v1/agent-sessions/{sessionId}/development/diff:
    get:
      operationId: getDevelopmentDiff
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevelopmentDiff'
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
  /api/v1/development/contract:
    get:
      operationId: getDevelopmentContract
      responses:
        '200':
          description: 当前构建打包的唯一API契约
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - protocolVersion
                - paths
                properties:
                  protocolVersion:
                    type: string
                    const: build-deployment-v3
                  paths:
                    type: object
components:
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
    ConversationSessionId:
      name: conversationSessionId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    ExecutionId:
      name: executionId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
  responses:
    ValidationFailed:
      description: 请求校验失败
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    NotFound:
      description: 资源不存在
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Conflict:
      description: 当前状态不允许该操作
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    IdempotencyKeyReused:
      description: 幂等键已用于其他请求
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
          example:
            code: IDEMPOTENCY_KEY_REUSED
  schemas:
    DevelopmentSelection:
      type: object
      additionalProperties: false
      required:
      - projectId
      - branchName
      properties:
        projectId:
          type: string
        branchName:
          type: string
    DevelopmentConfig:
      type: object
      additionalProperties: false
      required:
      - repository
      - previewBinding
      - previewConfigVersion
      - productionBinding
      - productionConfigVersion
      - version
      properties:
        repository:
          type: string
        previewBinding:
          type: string
        previewConfigVersion:
          type: string
        productionBinding:
          type: string
        productionConfigVersion:
          type: string
        version:
          type: integer
          format: int64
          minimum: 0
    DevelopmentConfigRequest:
      type: object
      additionalProperties: false
      required:
      - repository
      - previewBinding
      - previewConfigVersion
      - productionBinding
      - productionConfigVersion
      - expectedVersion
      properties:
        repository:
          type: string
        previewBinding:
          type: string
        previewConfigVersion:
          type: string
        productionBinding:
          type: string
        productionConfigVersion:
          type: string
        expectedVersion:
          type: integer
          format: int64
          minimum: 0
    DevelopmentProject:
      type: object
      additionalProperties: false
      required:
      - projectId
      - name
      - version
      - developmentConfigured
      - repository
      properties:
        projectId:
          type: string
        name:
          type: string
        version:
          type: integer
          format: int64
          minimum: 0
        developmentConfigured:
          type: boolean
        repository:
          type:
          - string
          - 'null'
    DevelopmentProjectPage:
      type: object
      additionalProperties: false
      required:
      - items
      - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DevelopmentProject'
        nextCursor:
          type:
          - string
          - 'null'
    DevelopmentBranchRequest:
      type: object
      additionalProperties: false
      required:
      - branchName
      - idempotencyKey
      properties:
        branchName:
          type: string
        idempotencyKey:
          type: string
          minLength: 1
          maxLength: 256
    DevelopmentBranchPage:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - branchName
            - headSha
            properties:
              branchName:
                type: string
              headSha:
                type: string
    DevelopmentSaveRequest:
      type: object
      additionalProperties: false
      required:
      - idempotencyKey
      - expectedRevision
      - commitMessage
      properties:
        idempotencyKey:
          type: string
        expectedRevision:
          type: integer
          format: int64
          minimum: 0
        commitMessage:
          type: string
          minLength: 1
    DevelopmentPreviewRequest:
      type: object
      additionalProperties: false
      required:
      - idempotencyKey
      - expectedRevision
      properties:
        idempotencyKey:
          type: string
        expectedRevision:
          type: integer
          format: int64
          minimum: 0
        commitMessage:
          type:
          - string
          - 'null'
    DevelopmentDeliverRequest:
      type: object
      additionalProperties: false
      required:
      - idempotencyKey
      - expectedSourceSha
      - expectedMainSha
      - confirmedScopeDigest
      properties:
        idempotencyKey:
          type: string
        expectedSourceSha:
          type: string
        expectedMainSha:
          type: string
        confirmedScopeDigest:
          type: string
    DevelopmentRecoverRequest:
      type: object
      additionalProperties: false
      required:
      - expectedVersion
      - idempotencyKey
      properties:
        expectedVersion:
          type: integer
          format: int64
          minimum: 0
        idempotencyKey:
          type: string
    DevelopmentOperation:
      type: object
      additionalProperties: false
      required:
      - operationId
      - type
      - phase
      - status
      - version
      - pushedSha
      - mergeSha
      - buildIds
      - error
      properties:
        operationId:
          type: string
          format: uuid
        type:
          type: string
          enum:
          - SAVE
          - PREVIEW
          - DELIVER
          - CREATE_BRANCH
        phase:
          type: string
          enum:
          - PREPARING
          - RECONCILING_REMOTE
          - PUSHING
          - VERIFYING
          - PUSHED
          - SAVING
          - BUILD_SUBMITTING
          - BUILD_RUNNING
          - DEPLOYMENT_PENDING
          - DEPLOYED
          - PRECHECK
          - MERGING
          - MERGED
          - RELEASE_SUBMITTING
          - RELEASING
          - RELEASED
        status:
          type: string
          enum:
          - PENDING
          - RUNNING
          - SUCCEEDED
          - BLOCKED
          - RESULT_UNKNOWN
          - FAILED
        version:
          type: integer
          format: int64
          minimum: 0
        pushedSha:
          type:
          - string
          - 'null'
        mergeSha:
          type:
          - string
          - 'null'
