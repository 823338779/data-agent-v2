features:
  - { id: session-crud, entry: "会话列表、创建和详情", success: "返回固定身份的会话", failure: "未知会话返回 404", security: "当前阶段不提供鉴权或租户切换", phase: 1 }
  - { id: message-execution, entry: "提交用户消息并创建 Agent 执行", success: "保存消息后由同一节点调用 Ollama", failure: "活动 Agent 执行 冲突返回 409", security: "事务边界", phase: 1 }
  - { id: session-sse, entry: "会话 SSE", success: "重放检查点后继续实时事件", failure: "断线后刷新恢复", security: "当前阶段使用固定身份", phase: 1 }
  - { id: session-user-activity, entry: "跨设备未读与更新时间排序", success: "按固定用户游标同步会话并按 updatedAt 降序返回", failure: "状态读取失败返回统一问题详情", security: "当前阶段使用固定用户", phase: 1 }
  - { id: activity-sse, entry: "用户级 activity SSE", success: "建连发送快照并仅在版本变化时收敛", failure: "重连先读取会话列表且不承诺永久事件历史", security: "只推送固定用户的会话", phase: 1 }
  - { id: metric-platform-credential, entry: "Metric Platform Credential CRUD 与验证", success: "凭据可绑定并验证", failure: "无效凭据返回稳定错误", security: "密钥加密", phase: 4 }
  - { id: artifacts, entry: "Artifact 元数据、预览和下载", success: "生成受限下载链接", failure: "过期下载拒绝", security: "签名下载", phase: 10 }
  - { id: scheduled-tasks, entry: "定时任务 CRUD 和手工触发", success: "幂等创建执行", failure: "重复或无权触发拒绝", security: "任务归属和幂等键", phase: 13 }
  - { id: task-execution, entry: "任务执行详情、取消和时间线", success: "持久事件可重放", failure: "取消竞态和失败状态可见", security: "执行归属与 fencing token", phase: 13 }
  - { id: mutation-guard, entry: "评估变更保护状态", success: "仅显式启用时公开保护状态", failure: "未启用时端点不存在", security: "评估会话标签约束", phase: 6 }
  - { id: pending-interaction, entry: "待处理交互解决", success: "用户选择恢复等待中的 Agent 执行", failure: "过期或重复交互拒绝", security: "会话和交互匹配", phase: 6 }
  - { id: secret-input, entry: "临时密钥输入", success: "密钥交给运行态后清除字符数组", failure: "密钥不持久化且失败可重试", security: "HTTPS 和零持久化", phase: 7 }
  - { id: multi-instance-redis-notification, entry: "多实例 Redis 通知", success: "通知转发到持有浏览器 SSE 的节点", failure: "Redis 中断时保留数据库检查点", security: "消息只携带固定租户定位信息和流增量", phase: 1 }
  - { id: no-service-discovery, entry: "Nginx 单域名入口", success: "两个副本无需服务发现或直接 RPC", failure: "单副本故障由 Nginx 健康检查隔离", security: "浏览器不直连内部副本", phase: 1 }
  - { id: same-ingress-ollama, entry: "同入口节点执行 Ollama", success: "保存用户 Message 的节点在提交后执行模型", failure: "节点故障时不被其他节点领取或重试", security: "Agent 执行不进入跨节点工作队列", phase: 1 }
  - { id: answer-stream, entry: "assistant_delta", success: "逐 Token 展示回答草稿", failure: "最终消息与草稿去重", security: "只持久化最终回答和累计检查点", phase: 1 }
  - { id: refresh-recovery, entry: "运行期间刷新", success: "从 AgentExecutionStreamCheckpoint 检查点恢复后继续实时流", failure: "重放/实时重叠按序列去重", security: "当前阶段使用固定身份", phase: 1 }
  - { id: active-execution-conflict, entry: "同会话并发消息", success: "数据库仅允许一个活动 Agent 执行", failure: "第二个提交返回 409", security: "唯一约束包含 tenant_id 和 conversation_session_id", phase: 1 }
  - { id: ollama-failure, entry: "Ollama 错误或超时", success: "持久化 execution_failed 与 FAILED", failure: "不自动换节点或重试模型", security: "错误不暴露凭据和内部载荷", phase: 1 }
  - { id: stale-execution-timeout, entry: "陈旧 Agent 执行 看门狗", success: "超过硬截止时间的 Agent 执行标记失败", failure: "看门狗绝不调用模型", security: "固定租户范围内扫描", phase: 1 }
